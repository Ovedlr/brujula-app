<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brújula · evaluación con rumbo</title>
<style>
:root{--bg:#f5f2ff;--card:#fff;--ink:#1d1b2e;--mute:#6b6880;--line:#e6e2f5;--p:#7c3aed;--p2:#ec4899;--ok:#059669;--okbg:#d1fae5;--bad:#dc2626;--badbg:#fee2e2;--warn:#d97706;--warnbg:#fef3c7;--chip:#efeafe;--sh:0 4px 14px rgba(80,50,160,.12);--r:14px}
[data-theme=dark]{--bg:#110f1d;--card:#1b1830;--ink:#efeaff;--mute:#a7a3c2;--line:#2f2b4a;--p:#a78bfa;--p2:#f472b6;--ok:#34d399;--okbg:#0f3b2e;--bad:#f87171;--badbg:#4a1c1c;--warn:#fbbf24;--warnbg:#47340b;--chip:#2a2548;--sh:0 4px 14px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(900px 400px at 10% -10%,rgba(124,58,237,.18),transparent),radial-gradient(700px 400px at 100% 0,rgba(236,72,153,.14),transparent),var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(90deg,#6d28d9,#db2777);color:#fff;box-shadow:var(--sh)}
header .brand{font-weight:800;font-size:15px;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:6px;background:none;border:0;color:#fff}
header nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:6px 0 4px}h2{font-size:15px;margin:0 0 8px}h3{font-size:13px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.mute{color:var(--mute)}.small{font-size:11.5px}
label{display:block;font-size:11.5px;font-weight:600;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
textarea{min-height:60px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.btn{font:600 12.5px system-ui;min-height:34px;padding:6px 13px;border-radius:999px;border:0;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--p),var(--p2));box-shadow:0 2px 6px rgba(124,58,237,.3)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--chip);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.18);box-shadow:none;color:#fff}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.btn.sm{min-height:28px;padding:3px 10px;font-size:11.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border:2px solid var(--line);border-radius:11px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--p)}.opt:has(input:checked){border-color:var(--p);background:var(--chip)}
.conf{display:flex;gap:6px;margin:6px 0}.conf label{margin:0;flex:1;text-align:center;padding:6px;border:2px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink)}
.conf label:has(input:checked){border-color:var(--p2);background:var(--chip)}.conf input{position:absolute;opacity:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2))}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.hint{background:var(--warnbg)}.fb.story{background:var(--chip)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-size:11px;text-transform:uppercase}
.qc{border:1px dashed var(--line);border-radius:12px;padding:10px;margin:8px 0}
.lock{opacity:.55}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1d1b2e;color:#fff;padding:8px 14px;border-radius:99px;z-index:20;font-weight:600}
.hero{text-align:center;padding:18px 8px}.hero h1{font-size:24px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:34px;font-weight:800;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-1px)}}
@media print{header,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header>
  <button class="brand" data-act="home" aria-label="Inicio">🧭 <span id="appname">Brújula</span></button>
  <nav id="nav"></nav>
</header>
<main id="app" tabindex="-1"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */
const CFG={URL:'https://bclbbulqhffnieysahqr.supabase.co',KEY:'sb_publishable_WWmySdsKUERHqv_3DL0EfQ_kFTZgto9',APP:'Brújula',CONTACT:''};
const FN=CFG.URL+'/functions/v1/api';
document.getElementById('appname').textContent=CFG.APP;
const sb=window.supabase.createClient(CFG.URL,CFG.KEY);

/* ================= UTILIDADES ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app');
const ERR={ROOM_NOT_FOUND:'No encontramos esa sala. Revisa el código.',ROOM_CLOSED:'La sala está cerrada o expiró.',ROOM_FULL:'La sala está llena.',OWNER_TRIAL_EXPIRED:'Esta sala ya no está disponible (el docente debe activar su plan).',BAD_TOKEN:'Tu sesión no es válida. Entra de nuevo con el código.',ALREADY:'Esa pregunta ya fue respondida.',AUTH:'Inicia sesión de nuevo.',NOT_OWNER:'No tienes permiso.',NO_TOPIC:'Escribe un tema.',TRIAL_EXPIRED:'Tu prueba de 7 días terminó. Activa un plan para crear contenido nuevo.',TRIAL_LIMIT_EVALS:'Límite de la prueba: 3 evaluaciones.',TRIAL_FEATURE:'Los casos con decisión se activan con un plan de pago.',SERVER_ERROR:'Error del servidor. Intenta de nuevo.',SAVE_FAILED:'No se pudo guardar. Intenta de nuevo.'};
const msg=e=>{const m=String(e?.message||e);for(const k in ERR)if(m.includes(k))return ERR[k];if(/Database error saving new user/i.test(m))return 'Ya existe una cuenta con ese correo (o una variante).';return m};
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function api(action,body={},auth=false){
  const h={'Content-Type':'application/json',apikey:CFG.KEY};
  if(auth){const {data}=await sb.auth.getSession();if(data.session)h.Authorization='Bearer '+data.session.access_token}
  const r=await fetch(FN,{method:'POST',headers:h,body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'SERVER_ERROR');
  return j;
}
const fmtD=d=>new Date(d).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});
const uid=()=>crypto.randomUUID();
const link=code=>location.origin+location.pathname+'?sala='+code;

/* tema */
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('bj_theme',t)}catch{}}
(function(){let t;try{t=localStorage.getItem('bj_theme')}catch{}if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';setTheme(t)})();

/* gráficos */
function bars(items){return items.map(i=>`<div style="margin:5px 0"><div class="row small"><span>${esc(i.name)}</span><b class="sp">${i.pct}%</b></div><div class="bar"><i style="width:${i.pct}%"></i></div></div>`).join('')||'<p class="mute small">Sin datos todavía.</p>'}
function radar(items){
  if(items.length<3)return bars(items);
  const n=items.length,c=120,R=78,pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[c+Math.cos(a)*R*v/100,c+Math.sin(a)*R*v/100]};
  const ring=v=>`<polygon points="${items.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
  const poly=items.map((it,i)=>pt(i,it.pct).map(x=>x.toFixed(1)).join(',')).join(' ');
  const lab=items.map((it,i)=>{const[x,y]=pt(i,122);const a=x<c-8?'end':x>c+8?'start':'middle';return`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" font-size="9" fill="var(--ink)">${esc(it.name.slice(0,16))} ${it.pct}%</text>`}).join('');
  return`<svg viewBox="0 0 240 240" role="img" aria-label="Mapa de competencias" style="width:100%;max-width:320px;display:block;margin:auto">${[25,50,75,100].map(ring).join('')}<polygon points="${poly}" fill="rgba(124,58,237,.3)" stroke="var(--p)" stroke-width="2"/>${lab}</svg>`;
}

/* ================= NAVEGACIÓN ================= */
let user=null,TIMER=null,RT=null,POLL=null;
function cleanup(){clearInterval(TIMER);clearInterval(POLL);if(RT){sb.removeChannel(RT);RT=null}}
function nav(){
  $('#nav').innerHTML=(user?`<button class="btn ghost sm" data-act="dash">Panel</button><button class="btn ghost sm" data-act="logout">Salir</button>`:`<button class="btn ghost sm" data-act="home">Entrar a sala</button><button class="btn ghost sm" data-act="login">Docentes</button>`)+`<button class="btn ghost sm" data-act="theme" aria-label="Cambiar tema claro u oscuro">${document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}</button>`;
}
function go(h){if(location.hash===h)route();else location.hash=h}
async function route(){
  cleanup();nav();
  const h=location.hash||'#/';
  const {data}=await sb.auth.getSession();user=data.session?.user||null;nav();
  if(h.startsWith('#/play'))return playRoute();
  if(h.startsWith('#/t')){if(!user)return authView();
    if(h.startsWith('#/t/eval/'))return editorView(h.split('/')[3]);
    if(h.startsWith('#/t/res/'))return resultsView(h.split('/')[3]);
    return dashView()}
  if(h==='#/login')return authView();
  return homeView();
}
window.addEventListener('hashchange',route);

/* ================= INICIO ================= */
function homeView(){
  const q=new URLSearchParams(location.search).get('sala')||'';
  app.innerHTML=`<div class="hero"><h1>Evalúa con rumbo, no solo con puntos</h1><p class="mute">Casos con decisiones · confianza calibrada · pistas socráticas con IA · mapa de competencias · retos en equipo · misiones narrativas</p></div>
  <div class="grid g2"><section class="card"><h2>Soy participante</h2>
    <form id="jf"><label for="jc">Código de sala</label><input id="jc" maxlength="6" autocomplete="off" value="${esc(q.toUpperCase())}" placeholder="ABC234" style="text-transform:uppercase;letter-spacing:3px;font-weight:700" required>
    <label for="jn">Tu nombre (opcional)</label><input id="jn" maxlength="40" autocomplete="name">
    <label for="jt">Equipo (si tu docente lo pide)</label><input id="jt" maxlength="30">
    <div class="row" style="margin-top:10px"><button class="btn" id="jb">Entrar</button></div><p id="je" class="small" style="color:var(--bad)" role="alert"></p></form></section>
  <section class="card"><h2>Soy docente o administrador</h2><p class="mute">Crea evaluaciones, comparte un código de sala y recibe los resultados en vivo. Con apoyo de IA para preguntas y retroalimentación.</p>
    <div class="row"><button class="btn" data-act="login">Entrar o crear cuenta</button></div>
    <p class="small mute" style="margin-top:10px">🎁 Prueba gratis de 7 días, sin tarjeta. En la prueba funcionan las herramientas esenciales (3 evaluaciones, 30 participantes por sala, 50 llamadas de IA).</p></section></div>`;
  $('#jf').onsubmit=async e=>{e.preventDefault();const b=$('#jb');b.disabled=true;$('#je').textContent='';
    try{const r=await api('join',{code:$('#jc').value,name:$('#jn').value,team:$('#jt').value});
      sessionStorage.setItem('bj_s',JSON.stringify({token:r.token,meta:r}));go('#/play')}
    catch(x){$('#je').textContent=msg(x);b.disabled=false}};
}

/* ================= PARTICIPANTE ================= */
let P={};
function playRoute(){
  try{P={...JSON.parse(sessionStorage.getItem('bj_s')||'null')}}catch{P={}}
  if(!P.token){go('#/');return}
  P.tries=0;P.start=0;
  if(P.started)return loadQ();
  const m=P.meta,e=m.evaluation,L=e.layers||{};
  const tags=[L.calibrated&&'Confianza calibrada',L.socratic&&'Pistas socráticas',L.competencies&&'Mapa de competencias',L.narrative&&'Misión narrativa',L.cases&&'Casos con decisión',L.team&&'Equipo'].filter(Boolean);
  app.innerHTML=`<section class="card"><span class="chip">Sala ${esc(m.code)}</span><h1>${esc(e.story?.title||e.title)}</h1>
   ${e.story?.intro?`<div class="fb story">${esc(e.story.intro)}</div>`:''}${e.description?`<p>${esc(e.description)}</p>`:''}
   <p class="small mute">${m.total} preguntas${e.rules?.timePerQuestion?` · ${e.rules.timePerQuestion}s por pregunta`:''}</p>
   <div class="row">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
   ${L.calibrated?'<p class="small mute">Antes de responder indicarás qué tan seguro estás. Se premia saber cuánto sabes.</p>':''}
   <div class="row" style="margin-top:10px"><button class="btn" id="go">Comenzar</button></div></section>`;
  $('#go').onclick=()=>{P.started=true;sessionStorage.setItem('bj_s',JSON.stringify({token:P.token,meta:P.meta,started:true}));loadQ()};
}
async function loadQ(){
  clearInterval(TIMER);
  app.innerHTML='<p class="mute" role="status">Cargando…</p>';
  try{const r=await api('question',{token:P.token});if(r.done){P.result=r.result;return showResult()}P.q=r;showQ()}
  catch(e){app.innerHTML=`<section class="card"><p style="color:var(--bad)" role="alert">${esc(msg(e))}</p><button class="btn" data-act="home">Volver</button></section>`}
}
function showQ(hint){
  const r=P.q,q=r.question,L=P.meta.evaluation.layers||{},R=P.meta.evaluation.rules||{};
  P.start=P.start||Date.now();
  const pct=Math.round(r.index/r.total*100);
  const opts=q.type==='short'?`<label for="at">Tu respuesta</label><textarea id="at" maxlength="600"></textarea>`
    :q.options.map((o,i)=>`<label class="opt"><input type="radio" name="o" value="${i}"><span>${esc(o)}</span></label>`).join('');
  const conf=L.calibrated?`<fieldset style="border:0;padding:0;margin:8px 0"><legend class="small mute" style="font-weight:600">¿Qué tan seguro estás?</legend><div class="conf">${[['1','Dudo'],['2','Algo seguro'],['3','Muy seguro']].map(([v,t])=>`<label><input type="radio" name="c" value="${v}"> ${t}</label>`).join('')}</div></fieldset>`:'';
  app.innerHTML=`<section class="card">
   <div class="row small"><span class="chip">${L.narrative?'Capítulo':'Pregunta'} ${r.index+1} de ${r.total}</span>${q.competency&&L.competencies?`<span class="chip">${esc(q.competency)}</span>`:''}<span class="sp timer" id="tm"></span></div>
   <div class="bar" style="margin:8px 0" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   ${q.scenario?`<div class="fb story"><b>${L.cases?'Caso':'Contexto'}:</b> ${esc(q.scenario)}</div>`:''}
   <h2 style="margin-top:10px">${esc(q.prompt)}</h2>
   <div id="hintbox" aria-live="polite">${hint||r.lastHint?`<div class="fb hint">💡 ${esc(hint||r.lastHint)}</div>`:''}</div>
   <form id="qf">${opts}${conf}<div class="row" style="margin-top:8px"><button class="btn" id="sb">Responder</button>${L.socratic?`<span class="small mute">Pistas disponibles: ${Math.max(0,r.maxHints-r.tries)}</span>`:''}</div><p id="qe" class="small" style="color:var(--bad)" role="alert"></p></form></section>`;
  $('#qf').onsubmit=e=>{e.preventDefault();submit(false)};
  if(R.timePerQuestion>0){let t=R.timePerQuestion;const tick=()=>{$('#tm').textContent='⏱ '+t+'s';if(t--<=0){clearInterval(TIMER);submit(true)}};tick();TIMER=setInterval(tick,1000)}
}
async function submit(timeout){
  const r=P.q,q=r.question,L=P.meta.evaluation.layers||{};
  let a=null;
  if(q.type==='short')a={text:$('#at')?.value||''};else{const s=$('input[name=o]:checked');if(s)a={index:+s.value}}
  const c=$('input[name=c]:checked');
  if(!timeout){if(!a||(q.type==='short'&&!a.text.trim())){$('#qe').textContent='Elige o escribe una respuesta.';return}
    if(L.calibrated&&!c){$('#qe').textContent='Indica qué tan seguro estás.';return}}
  clearInterval(TIMER);$('#sb').disabled=true;
  try{
    const x=await api('answer',{token:P.token,question_id:q.id,answer:a,confidence:c?+c.value:null,time_ms:Date.now()-P.start});
    if(!x.final){r.tries++;showQ(x.hint);return}
    P.start=0;showFeedback(x);
  }catch(e){$('#qe').textContent=msg(e);$('#sb').disabled=false}
}
function showFeedback(x){
  const L=P.meta.evaluation.layers||{};
  app.innerHTML=`<section class="card" aria-live="polite"><div class="fb ${x.correct?'ok':'bad'}"><h2>${x.correct?'✅ Bien hecho':'❌ A repasar'}</h2><p>${esc(x.feedback)}</p>
   ${x.correctAnswer?`<p class="small"><b>Respuesta esperada:</b> ${esc(x.correctAnswer)}</p>`:''}</div>
   ${x.consequence?`<div class="fb story"><b>Consecuencia de tu decisión:</b> ${esc(x.consequence)}</div>`:''}
   ${x.story?`<div class="fb story">📖 ${esc(x.story)}</div>`:''}
   <div class="row" style="margin-top:10px"><span class="chip ok">+${x.score} puntos</span>${L.calibrated&&x.calib?`<span class="chip ${x.calib>0?'ok':'bad'}">Calibración ${x.calib>0?'+':''}${x.calib}</span>`:''}<button class="btn sp" id="nx">Siguiente</button></div></section>`;
  $('#nx').onclick=loadQ;$('#nx').focus();
}
function showResult(){
  const r=P.result,L=P.meta.evaluation.layers||{};
  app.innerHTML=`<section class="card"><h1>Resultado final</h1><div class="big">${r.total} <span class="small mute">de ${r.max} (${r.pct}%)</span></div>
   <div class="grid g2"><div>${L.competencies!==false?`<h3>Mapa de competencias</h3>${radar(r.profile)}`:''}</div>
   <div><h3>Tu retroalimentación</h3><div class="fb story">${esc(r.summary)}</div>
   ${L.calibrated?`<p class="small">Calibración: ${r.overconfident} respuesta(s) con mucha seguridad que fallaste; ${r.underconfident} acierto(s) en los que dudabas.</p>`:''}
   ${r.weakest&&r.pct<100?`<p class="small"><b>Próxima práctica:</b> refuerza <b>${esc(r.weakest)}</b>.</p>`:''}<p class="small mute">Pistas usadas: ${r.hints}</p></div></div>
   <div class="row noprint"><button class="btn sec" onclick="print()">Imprimir o guardar</button><button class="btn" id="out">Salir</button></div></section>`;
  $('#out').onclick=()=>{sessionStorage.removeItem('bj_s');go('#/')};
}

/* ================= AUTENTICACIÓN DOCENTE ================= */
function authView(){
  app.innerHTML=`<section class="card" style="max-width:420px;margin:20px auto"><h2>Acceso docente</h2>
  <div class="row"><button class="btn sm" id="tl">Entrar</button><button class="btn sec sm" id="tr">Crear cuenta</button></div>
  <form id="af"><label for="ae">Correo</label><input id="ae" type="email" autocomplete="email" required>
  <label for="ap">Contraseña</label><input id="ap" type="password" minlength="8" autocomplete="current-password" required>
  <div id="orgw" hidden><label for="ao">Institución o empresa</label><input id="ao" maxlength="80"></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="ab">Entrar</button></div><p id="am" class="small" role="alert"></p></form>
  <p class="small mute">Crear cuenta inicia tu prueba de 7 días, sin tarjeta.</p></section>`;
  let reg=false;const set=r=>{reg=r;$('#orgw').hidden=!r;$('#ab').textContent=r?'Crear cuenta':'Entrar';$('#tl').className='btn sm'+(r?' sec':'');$('#tr').className='btn sm'+(r?'':' sec')};
  $('#tl').onclick=()=>set(false);$('#tr').onclick=()=>set(true);
  $('#af').onsubmit=async e=>{e.preventDefault();const m=$('#am');m.style.color='var(--bad)';m.textContent='';$('#ab').disabled=true;
    try{
      if(reg){const {data,error}=await sb.auth.signUp({email:$('#ae').value,password:$('#ap').value,options:{data:{org_name:$('#ao').value},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session){m.style.color='var(--ok)';m.textContent='Cuenta creada. Revisa tu correo para confirmarla y luego entra.';$('#ab').disabled=false;return}}

const QT={mcq:'Opción múltiple',tf:'Verdadero o falso',short:'Respuesta corta',decision:'Caso con decisión 🔒'};
function q2ui(q){const k=q.answer_key||{};const u={id:q.id,type:q.type,prompt:q.prompt||'',scenario:q.scenario||'',competency:q.competency||'',hint:q.hint||'',explanation:q.explanation||'',unlock:q.unlock_text||'',review:q.review_text||'',opts:'',tf:'true',kw:''};
  if(q.type==='mcq')u.opts=(q.options||[]).map((o,i)=>(i===k.index?'*':'')+o).join('\n');
  if(q.type==='tf')u.tf=k.index===1?'false':'true';
  if(q.type==='short')u.kw=(k.keywords||[]).join(', ');
  if(q.type==='decision')u.opts=(q.options||[]).map((o,i)=>`${o} | ${k.scores?.[i]??0} | ${k.consequences?.[i]??''}`).join('\n');
  return u}
function ui2q(u,i){
  const base={id:u.id,evaluation_id:E.id,position:i,type:u.type,prompt:u.prompt.trim(),scenario:u.scenario.trim()||null,competency:u.competency.trim()||null,hint:u.hint.trim()||null,explanation:u.explanation.trim()||null,unlock_text:u.unlock.trim()||null,review_text:u.review.trim()||null,options:[],answer_key:{}};
  if(!base.prompt)throw new Error(`Pregunta ${i+1}: falta el enunciado.`);
  const lines=u.opts.split('\n').map(s=>s.trim()).filter(Boolean);
  if(u.type==='mcq'){if(lines.length<2)throw new Error(`Pregunta ${i+1}: escribe al menos 2 opciones (marca la correcta con *).`);const ix=lines.findIndex(l=>l.startsWith('*'));if(ix<0)throw new Error(`Pregunta ${i+1}: marca la opción correcta con * al inicio.`);base.options=lines.map(l=>l.replace(/^\*\s*/,''));base.answer_key={index:ix}}
  else if(u.type==='tf'){base.options=['Verdadero','Falso'];base.answer_key={index:u.tf==='true'?0:1}}
  else if(u.type==='short'){const kw=u.kw.split(',').map(s=>s.trim()).filter(Boolean);if(!kw.length)throw new Error(`Pregunta ${i+1}: escribe palabras clave.`);base.answer_key={keywords:kw,min:1}}
  else{if(lines.length<2)throw new Error(`Pregunta ${i+1}: escribe al menos 2 opciones: texto | puntaje 0-10 | consecuencia.`);const parts=lines.map(l=>l.split('|').map(s=>s.trim()));base.options=parts.map(p=>p[0]);base.answer_key={scores:parts.map(p=>Math.max(0,Math.min(10,Number(p[1])||0))),consequences:parts.map(p=>p[2]||'')}}
  return base}

  if(a==='theme'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');nav()}
  else if(a==='home')go(user&&location.hash.startsWith('#/t')?'#/t':'#/');
  else if(a==='login')go('#/login');
  else if(a==='dash')go('#/t');
  else if(a==='logout'){await sb.auth.signOut();user=null;go('#/')}
  else if(a==='neweval')newEval();
  else if(a==='newroom')newRoom(t.dataset.id);
  else if(a==='deleval'){if(confirm('¿Borrar esta evaluación con sus salas y resultados? No se puede deshacer.')){const r=await sb.from('evaluations').delete().eq('id',t.dataset.id);if(r.error)toast(msg(r.error));dashView()}}
  else if(a==='close'){await sb.from('rooms').update({status:'closed'}).eq('id',t.dataset.id);dashView()}
  else if(a==='copy'){try{await navigator.clipboard.writeText(t.dataset.v);toast('Enlace copiado')}catch{prompt('Copia el enlace:',t.dataset.v)}}
  else if(a==='saveeval')saveEval();
  else if(a==='addq'){collect();QS.push(q2ui({id:uid(),type:'mcq',options:[],answer_key:{}}));drawEditor()}
  else if(a==='delq'){collect();const u=QS.splice(+t.dataset.i,1)[0];DEL.push(u.id);drawEditor()}
  else if(a==='gen')genQ();
  else if(a==='detail'){RS.sel=t.dataset.id;drawRes();$('main').scrollTo?.(0,0)}
  else if(a==='csv')exportCsv();
  else if(a==='aisum'){t.disabled=true;try{const r=await api('summary',{room_id:RS.room.id},true);RS.ai=r.summary+(r.simulated?'\n\n(Resumen sin IA: configura ANTHROPIC_API_KEY o espera nuevo cupo.)':'');}catch(x){RS.ai=msg(x)}drawRes()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset?.act==='qtype'){collect();drawEditor()}
  if(t.dataset?.act==='layer'){collect();drawEditor()}
});
route();
</script>
</body>
</html>
