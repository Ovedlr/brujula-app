function qrSvg(text){
  try{if(typeof qrcode!=='function')return'';const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4},${r+4}h1v1h-1z`;

  catch{return''}

function normPhone(x){let d=String(x||'').replace(/\D/g,'');if(d.length===10&&d[0]==='3')d='57'+d;return d.length>=7&&d.length<=15?d:''}
function csvRows(text){
  text=String(text||'').replace(/^﻿/,'');const first=(text.split(/\r?\n/).find(l=>l.trim())||'');
  const sep=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"'&&cell==='')q=true;
    else if(c===sep){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}

  row.push(cell);rows.push(row);return rows;
}
function rowsToInvites(rows){
  rows=(rows||[]).map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(Boolean));
  const out=[],seen=new Set(),EM=/[^\s@,;<>"]+@[^\s@,;<>"]+\.[^\s@,;<>"]+/,PH=/\+?\d[\d\s().-]{5,}\d/;
  const H=(rows[0]||[]).map(h=>h.toLowerCase()),hi=re=>H.findIndex(h=>re.test(h));
  const head=!H.some(h=>h.includes('@'))&&H.some(h=>/^(nombres?|name|participante|apellidos?|correo|e-?mail|mail|celular|tel[eé]fono|whatsapp|m[oó]vil)/.test(h));
  let iN=-1,iA=-1,iE=-1,iP=-1;
  if(head){iN=hi(/^(nombres?|name|participante)/);iA=hi(/^apellidos?/);iE=hi(/(correo|e-?mail|mail)/);iP=hi(/(cel|tel|whats|m[oó]vil|phone)/);rows=rows.slice(1)}
  const add=(name,email,phone)=>{
    email=(String(email||'').match(EM)||[''])[0].toLowerCase().slice(0,120);phone=normPhone(phone);
    name=String(name||'').replace(/[\t;,"<>]+/g,' ').replace(/\s+/g,' ').trim();
    if(!name&&email)name=email.split('@')[0];
    const k=email||phone||name.toLowerCase();if(!k||seen.has(k))return;seen.add(k);
    out.push({name:name.slice(0,60),email,phone});
  };
  rows.forEach(r=>{
    if(head&&(iN>=0||iA>=0)){add([r[iN],r[iA]].filter((v,i)=>v&&(i?iA>=0:iN>=0)).join(' '),iE>=0?r[iE]:r.join(' '),iP>=0?r[iP]:'');return}
    let line=r.join(' ');const e=(line.match(EM)||[''])[0];if(e)line=line.replace(e,' ');
    const ph=(line.match(PH)||[''])[0];if(ph&&ph.replace(/\D/g,'').length>=7)line=line.replace(ph,' ');
    add(line,e,ph);
  });
  return out;
}

const RC=326.73;
function clockOf(r){
  const now=Date.now(),live=r.status==='open'&&new Date(r.expires_at)>now,lim=r.time_limit_sec||0;
  const st=r.started_at?+new Date(r.started_at):null,en=r.ends_at?+new Date(r.ends_at):null,sp=r.stopped_at?+new Date(r.stopped_at):null;
  if(sp){if(en){const left=Math.max(0,(en-sp)/1000);return{frac:lim?left/lim:0,txt:mmss(left),lab:left>0?'Reloj detenido':'Tiempo terminado',cls:'stop'}}

  if(!live)return{frac:0,txt:'—',lab:'Sala cerrada',cls:'stop'};
  if(!st)return{frac:1,txt:lim?mmss(lim):'∞',lab:lim?'Listo para iniciar':'Sin límite de tiempo',cls:'idle'};
  if(en){const left=Math.max(0,(en-now)/1000),f=lim?left/lim:0;return{frac:f,txt:mmss(left),lab:left>0?'Tiempo restante':'Tiempo terminado',cls:left<=0?'stop':left<=10?'urgent':f<=.25?'low':'ok'}}
  const el=(now-st)/1000;return{frac:(el%60)/60,txt:mmss(el),lab:'Transcurrido · sin límite',cls:'free'};
}

function bars(items){return items.map(i=>`<div style="margin:5px 0"><div class="row small"><span>${esc(i.name)}</span><b class="sp">${i.pct}%</b></div><div class="bar"><i style="width:${i.pct}%"></i></div></div>`).join('')||'<p class="mute small">Sin datos todavía.</p>'}

  const n=items.length,c=120,R=78,pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[c+Math.cos(a)*R*v/100,c+Math.sin(a)*R*v/100]};

  const poly=items.map((it,i)=>pt(i,it.pct).map(x=>x.toFixed(1)).join(',')).join(' ');
  const lab=items.map((it,i)=>{const[x,y]=pt(i,122);const a=x<c-8?'end':x>c+8?'start':'middle';return`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" font-size="9" fill="var(--ink)">${esc(it.name.slice(0,16))} ${it.pct}%</text>`}).join('');
  return`<svg viewBox="0 0 240 240" role="img" aria-label="Mapa de competencias" style="width:100%;max-width:320px;display:block;margin:auto">${[25,50,75,100].map(ring).join('')}<polygon points="${poly}" fill="rgba(124,58,237,.3)" stroke="var(--p)" stroke-width="2"/>${lab}</svg>`;
}

let P={};
function playRoute(){
  try{P={...JSON.parse(sessionStorage.getItem('bj_s')||'null')}}catch{P={}}

   ${e.story?.intro?`<div class="fb story">${esc(e.story.intro)}</div>`:''}${e.description?`<p>${esc(e.description)}</p>`:''}
   <p class="small mute">${m.total} preguntas${e.rules?.timePerQuestion?` · ${e.rules.timePerQuestion}s por pregunta`:''}</p>
   <div class="row">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
   ${L.calibrated?'<p class="small mute">Antes de responder indicarás qué tan seguro estás. Se premia saber cuánto sabes.</p>':''}

  $('#go').onclick=()=>{P.started=true;sessionStorage.setItem('bj_s',JSON.stringify({token:P.token,meta:P.meta,started:true}));loadQ()};
}
async function loadQ(){
  clearInterval(TIMER);
  app.innerHTML='<p class="mute" role="status">Cargando…</p>';
  try{handleQ(await api('question',{token:P.token}))}
  catch(e){app.innerHTML=`<section class="card"><p style="color:var(--bad)" role="alert">${esc(msg(e))}</p><button class="btn" data-act="home">Volver</button></section>`}
}
function handleQ(r){
  clearInterval(POLL);clearInterval(TOT);
  if(r.waiting)return showLobby(r);
  P.skew=r.server_now?r.server_now-Date.now():0;
  if(r.done){P.result=r.result;return showResult()}
  P.q=r;P.ends=r.ends_at?new Date(r.ends_at).getTime():null;showQ();
}
function showLobby(r){
  app.innerHTML=`<section class="card" style="text-align:center"><h2>Esperando el inicio…</h2><div class="big" id="lb">${r.joined} / ${r.max}</div><p class="mute">${P.meta?.mode==='invite'?'Han entrado los invitados que ves arriba. La evaluación empieza para todos al mismo tiempo, cuando entren todos o cuando quien la organiza la inicie.':'La evaluación empieza cuando se complete el cupo o cuando quien la organiza la inicie.'} No cierres esta página.</p></section>`;
  POLL=setInterval(async()=>{try{const x=await api('question',{token:P.token});if(!x.waiting)handleQ(x);else{const b=$('#lb');if(b)b.textContent=x.joined+' / '+x.max}}catch(e){if(/ROOM_CLOSED/.test(String(e.message))){clearInterval(POLL);app.innerHTML='<section class="card"><p>La sala se cerró.</p><button class="btn" data-act="home">Volver</button></section>'}}},3000);
}
function startTotal(){
  clearInterval(TOT);if(!P.ends)return;
  const tick=()=>{const left=(P.ends-(Date.now()+(P.skew||0)))/1000;const el=$('#tt');if(el)el.textContent='⏳ '+mmss(left);
    if(left<=0){clearInterval(TOT);clearInterval(TIMER);toast('Se acabó el tiempo');setTimeout(loadQ,1200)}};
  tick();TOT=setInterval(tick,1000);
}
function showQ(hint){
  const r=P.q,q=r.question,L=P.meta.evaluation.layers||{},R=P.meta.evaluation.rules||{};
  P.start=P.start||Date.now();
  const pct=Math.round(r.index/r.total*100);
  const opts=q.type==='short'?`<label for="at">Tu respuesta</label><textarea id="at" maxlength="600"></textarea>`
    :q.options.map((o,i)=>`<label class="opt"><input type="radio" name="o" value="${i}"><span>${esc(o)}</span></label>`).join('');
  const conf=L.calibrated?`<fieldset style="border:0;padding:0;margin:8px 0"><legend class="small mute" style="font-weight:600">¿Qué tan seguro estás?</legend><div class="conf">${[['1','Dudo'],['2','Algo seguro'],['3','Muy seguro']].map(([v,t])=>`<label><input type="radio" name="c" value="${v}"> ${t}</label>`).join('')}</div></fieldset>`:'';
  app.innerHTML=`<section class="card">
   <div class="row small"><span class="chip">${L.narrative?'Capítulo':'Pregunta'} ${r.index+1} de ${r.total}</span>${q.competency&&L.competencies?`<span class="chip">${esc(q.competency)}</span>`:''}<span class="sp timer" id="tm"></span><span class="chip warn timer" id="tt" ${P.ends?'':'hidden'}></span></div>
   <div class="bar" style="margin:8px 0" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   ${q.scenario?`<div class="fb story"><b>${L.cases?'Caso':'Contexto'}:</b> ${esc(q.scenario)}</div>`:''}
   <h2 style="margin-top:10px">${esc(q.prompt)}</h2>
   <div id="hintbox" aria-live="polite">${hint||r.lastHint?`<div class="fb hint">💡 ${esc(hint||r.lastHint)}</div>`:''}</div>
   <form id="qf">${opts}${conf}<div class="row" style="margin-top:8px"><button class="btn" id="sb">Responder</button>${L.socratic?`<span class="small mute">Pistas disponibles: ${Math.max(0,r.maxHints-r.tries)}</span>`:''}</div><p id="qe" class="small" style="color:var(--bad)" role="alert"></p></form></section>`;
  $('#qf').onsubmit=e=>{e.preventDefault();submit(false)};
  if(R.timePerQuestion>0){let t=R.timePerQuestion;const tick=()=>{$('#tm').textContent='⏱ '+t+'s';if(t--<=0){clearInterval(TIMER);submit(true)}};tick();TIMER=setInterval(tick,1000)}
  startTotal();
  clearInterval(POLL);POLL=setInterval(async()=>{try{const x=await api('question',{token:P.token});if(x.done){clearInterval(TIMER);toast('La evaluación terminó');handleQ(x)}}catch{}},15000);
}
async function submit(timeout){
  const r=P.q,q=r.question,L=P.meta.evaluation.layers||{};
  let a=null;
  if(q.type==='short')a={text:$('#at')?.value||''};else{const s=$('input[name=o]:checked');if(s)a={index:+s.value}}
  const c=$('input[name=c]:checked');
  if(!timeout){if(!a||(q.type==='short'&&!a.text.trim())){$('#qe').textContent='Elige o escribe una respuesta.';return}
    if(L.calibrated&&!c){$('#qe').textContent='Indica qué tan seguro estás.';return}}
  clearInterval(TIMER);$('#sb').disabled=true;
  try{
    const x=await api('answer',{token:P.token,question_id:q.id,answer:a,confidence:c?+c.value:null,time_ms:Date.now()-P.start});
    if(!x.final){r.tries++;showQ(x.hint);return}
    P.start=0;showFeedback(x);
  }catch(e){if(/TIME_UP|ROOM_CLOSED/.test(String(e.message))){toast('La evaluación terminó');return loadQ()}$('#qe').textContent=msg(e);$('#sb').disabled=false}
}
function showFeedback(x){
  const L=P.meta.evaluation.layers||{};
  app.innerHTML=`<section class="card" aria-live="polite"><div class="fb ${x.correct?'ok':'bad'}"><h2>${x.correct?'✅ Bien hecho':'❌ A repasar'}</h2><p>${esc(x.feedback)}</p>
   ${x.correctAnswer?`<p class="small"><b>Respuesta esperada:</b> ${esc(x.correctAnswer)}</p>`:''}</div>
   ${x.consequence?`<div class="fb story"><b>Consecuencia de tu decisión:</b> ${esc(x.consequence)}</div>`:''}
   ${x.story?`<div class="fb story">📖 ${esc(x.story)}</div>`:''}
   <div class="row" style="margin-top:10px"><span class="chip ok">+${x.score} puntos</span>${L.calibrated&&x.calib?`<span class="chip ${x.calib>0?'ok':'bad'}">Calibración ${x.calib>0?'+':''}${x.calib}</span>`:''}<button class="btn sp" id="nx">Siguiente</button></div></section>`;
  $('#nx').onclick=loadQ;$('#nx').focus();
}
function showResult(){
  const r=P.result,L=P.meta.evaluation.layers||{};
  app.innerHTML=`<section class="card"><h1>Resultado final</h1>${r.timeUp?'<p class="chip warn">Se terminó el tiempo</p>':''}<div class="big">${r.total} <span class="small mute">de ${r.max} (${r.pct}%)</span></div>
   <div class="grid g2"><div>${L.competencies!==false?`<h3>Mapa de competencias</h3>${radar(r.profile)}`:''}</div>
   <div><h3>Tu retroalimentación</h3><div class="fb story">${esc(r.summary)}</div>
   ${L.calibrated?`<p class="small">Calibración: ${r.overconfident} respuesta(s) con mucha seguridad que fallaste; ${r.underconfident} acierto(s) en los que dudabas.</p>`:''}
   ${r.weakest&&r.pct<100?`<p class="small"><b>Próxima práctica:</b> refuerza <b>${esc(r.weakest)}</b>.</p>`:''}<p class="small mute">Pistas usadas: ${r.hints}</p></div></div>
   <div class="row noprint"><button class="btn sec" onclick="print()">Imprimir o guardar</button><button class="btn" id="out">Salir</button></div></section>`;
  $('#out').onclick=()=>{sessionStorage.removeItem('bj_s');go('#/')};
}

/* ---------- pantalla de proyección (modo QR) ---------- */
async function projView(id){
  const {data:room,error}=await sb.from('rooms').select('*').eq('id',id).single();
  if(error||!room){app.innerHTML='<div class="card">Sala no encontrada.</div>';return}
  const ev=(await sb.from('evaluations').select('title').eq('id',room.evaluation_id).single()).data||{title:''};
  PJ={room,n:0};const url=link(room.code);
  app.innerHTML=`<div class="row noprint"><a href="#/t/res/${room.id}" class="btn sec sm" style="text-decoration:none">← Panel</a><button class="btn sec sm" data-act="fs">Pantalla completa</button><span class="small mute">Consejo: conecta el PC al proyector o TV, pulsa “Pantalla completa” y deja el panel abierto en otra pestaña.</span></div>
  <section class="card proj"><h1>${esc(ev.title)}</h1>
   <div class="grid g2" style="align-items:center"><div id="pqr"><div class="mute">Escanea para entrar</div><div class="qr" id="qrbox">${qrSvg(url)||'<p class="mute">Cargando QR…</p>'}</div><div class="code">${esc(room.code)}</div><div class="mute small">${esc(url)}</div></div>
   <div>${ringHtml('pring',clockOf(room),true)}<div class="big" id="pc" style="margin-top:8px"></div><div id="pst" class="mute"></div></div></div></section>`;
  const upd=async()=>{const [r,c]=await Promise.all([sb.from('rooms').select('*').eq('id',id).single(),sb.from('participants').select('id',{count:'exact',head:true}).eq('room_id',id)]);
    if(r.data)PJ.room=r.data;PJ.n=c.count??0;paintProj()};
  if(typeof qrcode!=='function')lib(QR_JS).then(()=>{const b=$('#qrbox');if(b)b.innerHTML=qrSvg(url)||'<p class="mute">Comparte este enlace: '+esc(url)+'</p>'}).catch(()=>{const b=$('#qrbox');if(b)b.innerHTML='<p class="mute">Sin conexión para generar el QR. Comparte este enlace: '+esc(url)+'</p>'});
  await upd();POLL=setInterval(upd,2000);TOT=setInterval(paintProj,1000);
}
function paintProj(){
  const r=PJ?.room;if(!r||!$('#pc'))return;
  const live=r.status==='open'&&new Date(r.expires_at)>Date.now(),started=!!r.started_at;
  $('#pc').textContent=PJ.n+' / '+r.max_participants+' participantes';
  $('#pqr').hidden=started||!live||PJ.n>=r.max_participants;
  $('#pst').textContent=!live?'Sala cerrada':r.stopped_at?'¡Todos terminaron! Gracias por participar.':!started?'Esperando participantes… escanea el QR':'¡Evaluación en curso!';
  setRing('pring',clockOf(r));
}

/* ---------- editor ---------- */
let E=null,QS=[],DEL=[];
const QT={mcq:'Opción múltiple',tf:'Verdadero o falso',short:'Respuesta corta',decision:'Caso con decisión 🔒'};
function q2ui(q){const k=q.answer_key||{};const u={id:q.id,type:q.type,prompt:q.prompt||'',scenario:q.scenario||'',competency:q.competency||'',hint:q.hint||'',explanation:q.explanation||'',unlock:q.unlock_text||'',review:q.review_text||'',opts:'',tf:'true',kw:''};
  if(q.type==='mcq')u.opts=(q.options||[]).map((o,i)=>(i===k.index?'*':'')+o).join('\n');
  if(q.type==='tf')u.tf=k.index===1?'false':'true';
  if(q.type==='short')u.kw=(k.keywords||[]).join(', ');
  if(q.type==='decision')u.opts=(q.options||[]).map((o,i)=>`${o} | ${k.scores?.[i]??0} | ${k.consequences?.[i]??''}`).join('\n');
  return u}
function ui2q(u,i){
  const base={id:u.id,evaluation_id:E.id,position:i,type:u.type,prompt:u.prompt.trim(),scenario:u.scenario.trim()||null,competency:u.competency.trim()||null,hint:u.hint.trim()||null,explanation:u.explanation.trim()||null,unlock_text:u.unlock.trim()||null,review_text:u.review.trim()||null,options:[],answer_key:{}};
  if(!base.prompt)throw new Error(`Pregunta ${i+1}: falta el enunciado.`);
  const lines=u.opts.split('\n').map(s=>s.trim()).filter(Boolean);
  if(u.type==='mcq'){if(lines.length<2)throw new Error(`Pregunta ${i+1}: escribe al menos 2 opciones (marca la correcta con *).`);const ix=lines.findIndex(l=>l.startsWith('*'));if(ix<0)throw new Error(`Pregunta ${i+1}: marca la opción correcta con * al inicio.`);base.options=lines.map(l=>l.replace(/^\*\s*/,''));base.answer_key={index:ix}}
  else if(u.type==='tf'){base.options=['Verdadero','Falso'];base.answer_key={index:u.tf==='true'?0:1}}
  else if(u.type==='short'){const kw=u.kw.split(',').map(s=>s.trim()).filter(Boolean);if(!kw.length)throw new Error(`Pregunta ${i+1}: escribe palabras clave.`);base.answer_key={keywords:kw,min:1}}
  else{if(lines.length<2)throw new Error(`Pregunta ${i+1}: escribe al menos 2 opciones: texto | puntaje 0-10 | consecuencia.`);const parts=lines.map(l=>l.split('|').map(s=>s.trim()));base.options=parts.map(p=>p[0]);base.answer_key={scores:parts.map(p=>Math.max(0,Math.min(10,Number(p[1])||0))),consequences:parts.map(p=>p[2]||'')}}
  return base}
async function editorView(id){
  app.innerHTML='<p class="mute" role="status">Cargando…</p>';
  const [e,q,s]=await Promise.all([sb.from('evaluations').select('*').eq('id',id).single(),sb.from('questions').select('*').eq('evaluation_id',id).order('position'),sb.rpc('my_status')]);
  if(e.error){app.innerHTML='<div class="card">No se encontró la evaluación.</div>';return}
  E=e.data;QS=(q.data||[]).map(q2ui);DEL=[];ST=s.data;drawEditor();
}
function collect(){
  if(!$('#et'))return;
  E.title=$('#et').value;E.context=$('#ec').value;E.description=$('#ed').value;
  E.competencies=$('#ecp').value.split(',').map(s=>s.trim()).filter(Boolean);
  E.rules={timePerQuestion:+$('#rt').value||0,maxHints:+$('#rh').value,reveal:$('#rr').checked};
  const L={};$$('[data-layer]').forEach(c=>L[c.dataset.layer]=c.checked);E.layers=L;
  E.story={title:$('#st')?.value||'',intro:$('#si')?.value||''};
  $$('.qc').forEach((c,i)=>{const u=QS[i];if(!u)return;const g=n=>$('.'+n,c)?.value??'';u.type=g('q-type');u.prompt=g('q-prompt');u.scenario=g('q-scn');u.competency=g('q-comp');u.hint=g('q-hint');u.explanation=g('q-exp');u.unlock=g('q-unl');u.review=g('q-rev');u.opts=$('.q-opts',c)?.value??u.opts;u.tf=$('.q-tf',c)?.value??u.tf;u.kw=$('.q-kw',c)?.value??u.kw});
}
function drawEditor(){
  const L=E.layers||{},trial=ST?.plan==='trial';
  const lay=[['calibrated','Confianza calibrada',0],['socratic','Retroalimentación socrática con IA',0],['competencies','Mapa de competencias',0],['narrative','Misión narrativa 🔒',1],['cases','Casos con decisión 🔒',1],['team','Reto en equipo 🔒',1]];
  const comps=(E.competencies||[]);
  app.innerHTML=`<div class="row"><a href="#/t" class="btn sec sm" style="text-decoration:none">← Panel</a><h1 style="margin:0">Editar evaluación</h1><button class="btn sp" data-act="saveeval">Guardar</button></div>
  <section class="card"><div class="grid g2"><div><label for="et">Título</label><input id="et" maxlength="120" value="${esc(E.title)}"><label for="ec">Uso</label><select id="ec"><option value="aula" ${E.context==='aula'?'selected':''}>Aula</option><option value="empresa" ${E.context==='empresa'?'selected':''}>Empresa</option></select><label for="ed">Descripción</label><textarea id="ed">${esc(E.description||'')}</textarea></div>
  <div><label for="ecp">Competencias (separadas por coma)</label><input id="ecp" value="${esc(comps.join(', '))}" placeholder="Comunicación, Normativa, Cálculo">
  <label>Capas</label>${lay.map(([k,t,lk])=>`<label class="row ${lk&&trial?'lock':''}" style="margin:3px 0;font-weight:500;color:var(--ink)"><input type="checkbox" data-layer="${k}" data-act="layer" ${L[k]?'checked':''} ${lk&&trial?'disabled':''}> ${t}</label>`).join('')}
  <div class="grid g3"><div><label for="rt">Segundos por pregunta (0 = sin límite)</label><input id="rt" type="number" min="0" value="${E.rules?.timePerQuestion||0}"></div><div><label for="rh">Pistas máximas</label><select id="rh">${[0,1,2,3].map(n=>`<option ${+E.rules?.maxHints===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label>&nbsp;</label><label class="row" style="color:var(--ink);font-weight:500"><input type="checkbox" id="rr" ${E.rules?.reveal!==false?'checked':''}> Mostrar respuesta</label></div></div></div></div>
  ${L.narrative?`<label for="st">Título de la misión</label><input id="st" maxlength="100" value="${esc(E.story?.title||'')}"><label for="si">Introducción narrativa</label><textarea id="si">${esc(E.story?.intro||'')}</textarea>`:''}</section>
  <section class="card"><h2>Generar con IA</h2><div class="grid g3"><div><label for="gt">Tema</label><input id="gt" maxlength="300"></div><div><label for="gn">Cantidad</label><input id="gn" type="number" min="1" max="10" value="5"></div><div><label for="gl">Nivel</label><select id="gl"><option>básico</option><option selected>intermedio</option><option>avanzado</option></select></div></div>
  <div class="row" style="margin-top:8px"><button class="btn" data-act="gen">✨ Generar preguntas</button><span id="gs" class="small mute"></span></div></section>
  <section class="card"><div class="row"><h2 style="margin:0">Preguntas (${QS.length})</h2><button class="btn sec sm sp" data-act="addq">+ Añadir</button></div>
  ${QS.map((u,i)=>`<div class="qc" data-i="${i}"><div class="row"><b>${i+1}.</b><select class="q-type" data-act="qtype" style="width:auto">${Object.entries(QT).filter(([k])=>!(k==='decision'&&trial)).map(([k,t])=>`<option value="${k}" ${u.type===k?'selected':''}>${t}</option>`).join('')}</select><button class="btn bad sm sp" data-act="delq" data-i="${i}">Quitar</button></div>
   <label>Enunciado</label><textarea class="q-prompt">${esc(u.prompt)}</textarea>
   ${L.cases||u.type==='decision'?`<label>Escenario del caso</label><textarea class="q-scn">${esc(u.scenario)}</textarea>`:`<input class="q-scn" type="hidden" value="${esc(u.scenario)}">`}
   ${u.type==='mcq'?`<label>Opciones (una por línea; la correcta empieza con *)</label><textarea class="q-opts">${esc(u.opts)}</textarea>`:''}
   ${u.type==='decision'?`<label>Decisiones: texto | puntaje 0-10 | consecuencia (7 o más cuenta como acierto)</label><textarea class="q-opts">${esc(u.opts)}</textarea>`:''}
   ${u.type==='tf'?`<label>Respuesta correcta</label><select class="q-tf"><option value="true" ${u.tf==='true'?'selected':''}>Verdadero</option><option value="false" ${u.tf==='false'?'selected':''}>Falso</option></select>`:''}
   ${u.type==='short'?`<label>Palabras clave aceptadas (coma)</label><input class="q-kw" value="${esc(u.kw)}">`:''}
   <div class="grid g2"><div><label>Competencia</label><input class="q-comp" list="cl" value="${esc(u.competency)}"></div><div><label>Pista socrática (no revela la respuesta)</label><input class="q-hint" value="${esc(u.hint)}"></div></div>
   <label>Explicación</label><input class="q-exp" value="${esc(u.explanation)}">
   ${L.narrative?`<div class="grid g2"><div><label>Si acierta: se desbloquea…</label><textarea class="q-unl">${esc(u.unlock)}</textarea></div><div><label>Si falla: ruta de repaso…</label><textarea class="q-rev">${esc(u.review)}</textarea></div></div>`:''}</div>`).join('')}
  <datalist id="cl">${comps.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></section>`;
}
async function saveEval(){
  collect();
  try{
    const rows=QS.map(ui2q);
    if(!E.title.trim())throw new Error('Escribe un título.');
    const {error}=await sb.from('evaluations').update({title:E.title,context:E.context,description:E.description,layers:E.layers,rules:E.rules,story:E.story,competencies:E.competencies}).eq('id',E.id);
    if(error)throw error;
    if(DEL.length){const d=await sb.from('questions').delete().in('id',DEL);if(d.error)throw d.error;DEL=[]}
    if(rows.length){const u=await sb.from('questions').upsert(rows,{onConflict:'id'});if(u.error)throw u.error}
    toast('Guardado ✔');
  }catch(e){toast(msg(e))}
}
async function genQ(){
  collect();const t=$('#gt').value.trim();if(!t)return toast('Escribe un tema.');
  $('#gs').textContent='Generando…';
  try{
    const r=await api('generate',{topic:t,count:+$('#gn').value,level:$('#gl').value,context:E.context,competencies:E.competencies,cases:!!E.layers?.cases},true);
    r.questions.forEach(q=>QS.push(q2ui({...q,id:uid()})));
    drawEditor();toast(r.simulated?'Preguntas simuladas (IA no configurada o sin cupo). Edítalas.':'Preguntas generadas ✔');
  }catch(e){$('#gs').textContent=msg(e)}
}

/* ---------- resultados ---------- */
let RS=null;
async function resultsView(roomId){
  app.innerHTML='<p class="mute" role="status">Cargando…</p>';
  const rm=await sb.from('rooms').select('*').eq('id',roomId).single();
  if(rm.error){app.innerHTML='<div class="card">Sala no encontrada.</div>';return}
  RS={room:rm.data,sel:null,ai:null};
  const [ev,qs]=await Promise.all([sb.from('evaluations').select('title,layers,competencies').eq('id',rm.data.evaluation_id).single(),sb.from('questions').select('id,prompt,type,options,competency,position').eq('evaluation_id',rm.data.evaluation_id).order('position')]);
  RS.ev=ev.data;RS.qs=qs.data||[];await refreshRes();
  RT=sb.channel('res'+roomId).on('postgres_changes',{event:'*',schema:'public',table:'attempts',filter:'room_id=eq.'+roomId},()=>{clearTimeout(RS.d);RS.d=setTimeout(refreshRes,700)}).subscribe();
  POLL=setInterval(refreshRes,6000);TOT=setInterval(tickPanel,1000);
}
async function refreshRes(){
  if(!RS)return;
  const [p,a,r]=await Promise.all([sb.from('participants').select('id,name,team,summary,joined_at,finished_at,email,invited,started_at,token,phone').eq('room_id',RS.room.id).order('joined_at'),sb.from('attempts').select('*').eq('room_id',RS.room.id).eq('finalized',true),sb.from('rooms').select('*').eq('id',RS.room.id).single()]);
  RS.ps=p.data||[];RS.at=a.data||[];if(r.data){if(RS.room.started_at&&!RS.room.stopped_at&&r.data.stopped_at&&!RS.manualStop)toast('Todos terminaron: el reloj se detuvo solo.');RS.room=r.data}
  const ae=document.activeElement;
  if(ae&&app.contains(ae)&&ae.matches('input,textarea,select'))return; // no borrar lo que el docente está escribiendo
  drawRes();
}
function roomState(room){
  const now=Date.now(),live=room.status==='open'&&new Date(room.expires_at)>now;
  if(room.stopped_at)return{t:'Terminada',c:'ok'};
  if(!live)return{t:'Cerrada',c:'bad'};
  if(!room.started_at)return{t:room.mode==='invite'?'Esperando invitados':'En espera (lobby)',c:'warn'};
  if(room.ends_at&&new Date(room.ends_at)<=now)return{t:'Tiempo terminado',c:'bad'};
  return{t:'En curso',c:'ok'};
}
function pstatus(p,at,room){
  if(p.finished_at)return{t:'Terminó',c:'ok'};
  if(at.some(a=>a.participant_id===p.id)||(p.started_at&&room?.started_at))return{t:'En curso',c:'warn'};
  if(p.started_at)return{t:'Entró, esperando',c:'warn'};
  return{t:'No ha entrado',c:'bad'};
}
function ctlHtml(){
  const {room,ps}=RS,st=roomState(room),live=room.status==='open'&&new Date(room.expires_at)>Date.now();
  const lim=room.time_limit_sec||0,m=Math.floor(lim/60),sc=lim%60;
  const inv=ps.filter(p=>p.invited),inN=inv.filter(p=>p.started_at).length;
  const count=room.mode==='invite'?`${inN} / ${inv.length} entraron`:`${ps.length} / ${room.max_participants}`;
  const canStart=live&&!room.started_at&&(room.mode!=='invite'||inN>0);
  const startLbl=room.mode==='invite'&&inv.length&&inN<inv.length?`▶ Iniciar ahora (faltan ${inv.length-inN})`:'▶ Iniciar ahora';
  return `<section class="card noprint"><div class="row"><h2 style="margin:0">Control de sala</h2><span class="chip">${MODE[room.mode]||'Enlace'}</span><span class="chip ${st.c}">${st.t}</span><span class="chip">${count}</span>
   <div class="row sp">${room.mode==='qr'&&live&&!room.stopped_at?`<a class="btn sm pconly" href="#/t/proj/${room.id}" target="_blank" rel="noopener" style="text-decoration:none">📺 Proyectar QR</a><span class="small mute mobonly">Para proyectar el QR abre este panel desde un PC.</span>`:''}
   ${canStart?`<button class="btn ok sm" data-act="startroom">${startLbl}</button>`:''}
   ${live&&room.started_at&&!room.stopped_at?'<button class="btn sm" data-act="stoproom" style="background:var(--warn)">⏹ Detener reloj</button>':''}
   ${live?'<button class="btn bad sm" data-act="closeroom">Cerrar sala</button>':''}</div></div>
   <div class="grid g2" style="margin-top:8px;align-items:center"><div>${ringHtml('cring',clockOf(room))}</div>
   <div><label>Tiempo límite de la evaluación (min : seg)</label><div class="row"><input id="smin" type="number" min="0" max="1440" value="${m}" style="width:80px" aria-label="Minutos"><b>:</b><input id="ssec" type="number" min="0" max="59" value="${sc}" style="width:80px" aria-label="Segundos"><button class="btn sec sm" data-act="settime" ${room.stopped_at?'disabled':''}>Guardar</button></div>
   <p class="small mute">0:00 = sin límite. Si la evaluación ya inició, el cambio recalcula el final. El reloj se detiene solo cuando todos los que entraron terminan.${room.mode==='invite'?' Arranca automáticamente cuando entran todos los invitados; si falta alguien, puedes iniciarla tú.':''}</p></div></div>
   ${room.mode==='invite'?inviteHtml():''}</section>`;
}

   <p class="small mute" style="margin:3px 0 0">Si tu hoja tiene encabezados, uso las columnas Nombre, Apellido, Correo y Celular; las demás se ignoran. Revisa la lista antes de añadir.</p>

   ${inv.length?`<div class="row small" style="margin:10px 0"><span class="chip ok">Terminaron ${cnt.t}</span><span class="chip warn">Entraron ${cnt.e}</span><span class="chip bad">Sin entrar ${cnt.n}</span><span class="sp row">${RS.send?'':'<button class="btn sm" data-act="sendstart">📨 Enviar invitaciones</button>'}<button class="btn sec sm" data-act="copyall">Copiar enlaces</button><button class="btn sec sm" data-act="copypend">Copiar pendientes</button><button class="btn sec sm" data-act="csvinv">CSV de invitados</button></span></div>
   ${sendBox()}<table><tr><th>Nombre</th><th>Contacto</th><th>Estado</th><th>Enviar</th></tr>${rows}</table>`:'<p class="mute small">Aún no hay invitados.</p>'}`;
}
const pstats=(p,at)=>{const r=at.filter(a=>a.participant_id===p.id);const s=r.reduce((x,a)=>x+Number(a.score),0),c=r.reduce((x,a)=>x+Number(a.calib),0);return{n:r.length,score:s,calib:c,total:Math.max(0,s+c),hints:r.reduce((x,a)=>x+a.hints_used,0),ok:r.filter(a=>a.correct).length}};
const compProfile=at=>{const m={};at.forEach(a=>{const c=a.competency||'General';(m[c]??={s:0,n:0});m[c].s+=Number(a.score);m[c].n++});return Object.entries(m).map(([name,v])=>({name,pct:Math.round(v.s/(v.n*10)*100)}))};
function drawRes(){
  const dr=$('#invtxt');if(dr)RS.draft=dr.value;
  const {room,ps,at,qs,ev}=RS,tq=qs.length;
  const stats=ps.map(p=>({p,...pstats(p,at)}));
  const avg=stats.length&&tq?Math.round(stats.reduce((s,x)=>s+x.score,0)/(stats.length*tq*10)*100):0;
  const qrows=qs.map((q,i)=>{const r=at.filter(a=>a.question_id===q.id);return`<tr><td>${i+1}. ${esc(q.prompt.slice(0,70))}</td><td>${esc(q.competency||'')}</td><td>${r.length?Math.round(r.filter(a=>a.correct).length/r.length*100)+'%':'–'}</td><td>${r.reduce((s,a)=>s+a.hints_used,0)}</td></tr>`}).join('');
  const teams=[...new Set(ps.map(p=>p.team).filter(Boolean))];
  const sel=RS.sel&&ps.find(p=>p.id===RS.sel);
  app.innerHTML=`<div class="row"><a href="#/t" class="btn sec sm" style="text-decoration:none">← Panel</a><h1 style="margin:0">${esc(ev.title)} · sala ${esc(room.code)}</h1><div class="row sp noprint">${room.mode==='invite'?'':`<button class="btn sec sm" data-act="copy" data-v="${esc(link(room.code))}">Copiar enlace</button>`}<button class="btn sm" data-act="csv">Exportar CSV</button></div></div>
  ${ctlHtml()}<div class="grid g3" style="margin-top:10px"><div class="card"><div class="small mute">Participantes</div><div class="big">${ps.length}</div></div><div class="card"><div class="small mute">Terminaron</div><div class="big">${ps.filter(p=>p.finished_at).length}</div></div><div class="card"><div class="small mute">Acierto promedio</div><div class="big">${avg}%</div></div></div>
  <div class="grid g2"><section class="card"><h2>Mapa de competencias del grupo</h2>${radar(compProfile(at))}</section>
  <section class="card"><h2>Resumen con IA</h2><button class="btn sm" data-act="aisum">Generar resumen</button><div id="aisum" class="fb story" style="margin-top:8px" ${RS.ai?'':'hidden'} aria-live="polite">${esc(RS.ai||'')}</div></section></div>
  <section class="card"><h2>Por pregunta</h2><table><tr><th>Pregunta</th><th>Competencia</th><th>Acierto</th><th>Pistas</th></tr>${qrows}</table></section>
  <section class="card"><h2>Participantes</h2><table><tr><th>Nombre</th>${teams.length?'<th>Equipo</th>':''}<th>Avance</th><th>Puntaje</th><th>Calibración</th><th>Pistas</th><th></th></tr>
  ${stats.map((x,i)=>`<tr><td>${esc(x.p.name||'Anónimo '+(i+1))}</td>${teams.length?`<td>${esc(x.p.team||'')}</td>`:''}<td>${x.n}/${tq}${x.p.finished_at?' ✔':''}</td><td><b>${x.total}</b></td><td>${x.calib>0?'+':''}${x.calib}</td><td>${x.hints}</td><td><button class="btn sec sm" data-act="detail" data-id="${x.p.id}">Ver</button></td></tr>`).join('')||'<tr><td colspan="6" class="mute">Esperando participantes…</td></tr>'}</table></section>
  ${teams.length?`<section class="card"><h2>Equipos (evidencia individual)</h2>${teams.map(t=>{const m=stats.filter(x=>x.p.team===t);return`<h3>${esc(t)} · promedio ${Math.round(m.reduce((s,x)=>s+x.total,0)/m.length)}</h3><p class="small">${m.map(x=>`${esc(x.p.name||'Anónimo')}: ${x.total} pts (${x.ok} aciertos)`).join(' · ')}</p>`}).join('')}</section>`:''}
  ${sel?`<section class="card"><h2>${esc(sel.name||'Anónimo')}</h2><div class="grid g2"><div>${radar(compProfile(at.filter(a=>a.participant_id===sel.id)))}${sel.summary?`<div class="fb story">${esc(sel.summary)}</div>`:''}</div>
  <table><tr><th>Pregunta</th><th>Resp.</th><th>Conf.</th><th>Pts</th></tr>${qs.map((q,i)=>{const a=at.find(a=>a.participant_id===sel.id&&a.question_id===q.id);return`<tr><td>${i+1}</td><td>${a?`<span class="chip ${a.correct?'ok':'bad'}">${a.correct?'✔':'✘'}</span> ${esc(ansText(q,a.answer).slice(0,40))}`:'–'}</td><td>${a?.confidence??'–'}</td><td>${a?a.score:'–'}</td></tr>`}).join('')}</table></div></section>`:''}`;
  if(RS.draft&&$('#invtxt'))$('#invtxt').value=RS.draft;
  tickPanel();
}
const ansText=(q,a)=>q.type==='short'?(a?.text||''):(q.options?.[a?.index]??'');
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const CSV_HEAD=['sala','evaluacion','participante','correo','celular','equipo','n_pregunta','pregunta','competencia','respuesta','confianza','pistas','intentos','tiempo_s','correcto','puntaje','calibracion','fecha'];
function resultRows(room,ev,qs,ps,at){
  const pm=new Map(ps.map((p,i)=>[p.id,{...p,i}])),qm=new Map(qs.map((q,i)=>[q.id,{...q,i}]));
  return at.map(a=>{const p=pm.get(a.participant_id),q=qm.get(a.question_id);return[room.code,ev?.title||'',p?.name||'Anónimo '+((p?.i??0)+1),p?.email||'',p?.phone||'',p?.team||'',(q?.i??0)+1,q?.prompt||'',a.competency||'',q?ansText(q,a.answer):'',a.confidence??'',a.hints_used,a.tries,Math.round((a.time_ms||0)/1000),a.correct?'sí':'no',a.score,a.calib,a.updated_at]});
}
function exportCsv(){const {room,ps,at,qs,ev}=RS;downloadCsv(`resultados_${room.code}.csv`,[CSV_HEAD,...resultRows(room,ev,qs,ps,at)])}
async function exportRooms(ids){
  const {data:rooms,error}=await sb.from('rooms').select('*').in('id',ids);if(error)throw error;
  const evIds=[...new Set(rooms.map(r=>r.evaluation_id))];
  const [ev,qs,ps,at]=await Promise.all([sb.from('evaluations').select('id,title').in('id',evIds),sb.from('questions').select('id,evaluation_id,prompt,type,options,competency,position').in('evaluation_id',evIds).order('position'),
    sb.from('participants').select('id,room_id,name,team,email,phone,joined_at').in('room_id',ids).order('joined_at'),sb.from('attempts').select('*').in('room_id',ids).eq('finalized',true)]);
  for(const x of [ev,qs,ps,at])if(x.error)throw x.error;
  const rows=rooms.flatMap(r=>resultRows(r,ev.data.find(e=>e.id===r.evaluation_id),qs.data.filter(q=>q.evaluation_id===r.evaluation_id),ps.data.filter(p=>p.room_id===r.id),at.data.filter(a=>a.room_id===r.id)));
  downloadCsv(rooms.length===1?`resultados_${rooms[0].code}.csv`:`resultados_${rooms.length}_salas_${new Date().toISOString().slice(0,10)}.csv`,[CSV_HEAD,...rows]);
}
function askDelete(n){
  return new Promise(res=>{const d=document.createElement('div');d.className='modal';
    d.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="mdt" style="max-width:440px;margin:0"><h2 id="mdt">${n>1?`Eliminar ${n} salas terminadas`:'Eliminar sala'}</h2>
     <p>Se borrarán ${n>1?'las salas':'la sala'} con todos sus participantes y resultados. Esto no se puede deshacer.</p><p><b>¿Quieres guardar los resultados antes de eliminar?</b></p>
     <div class="row"><button class="btn" data-m="export">Exportar CSV y eliminar</button><button class="btn bad" data-m="delete">Eliminar sin exportar</button><button class="btn sec" data-m="">Cancelar</button></div></div>`;
    const done=v=>{d.remove();res(v)};
    d.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m);else if(e.target===d)done('')});
    d.addEventListener('keydown',e=>{if(e.key==='Escape')done('')});
    document.body.appendChild(d);d.querySelector('[data-m=export]').focus()});
}

function legalView(){
  const o=esc(CFG.OWNER||'[Franky Lóez]'),nit=esc(CFG.NIT||'[98643481]'),em=esc(CFG.EMAIL||'[franklr76@gmail.com]'),city=esc(CFG.CITY||'[Bello, Antioquia]'),app_=esc(CFG.APP);
  app.innerHTML=`<section class="card legal"><h1>Aviso de privacidad y términos de uso de ${app_}</h1><p class="small mute">Última actualización: ${esc(CFG.UPDATED)}</p>
  <h2>1. Quién es quién</h2>
  <p><b>${app_}</b> es una plataforma de evaluaciones interactivas operada por ${o}, ${nit}, con domicilio en ${city}, Colombia. Contacto: ${em}.</p>
  <p>Cada <b>organizador</b> (docente, institución educativa o empresa) crea sus evaluaciones y decide a quién evaluar y con qué fin. Frente a los datos de sus participantes, el organizador es el <b>responsable del tratamiento</b> y ${app_} actúa como <b>encargado</b>: trata los datos por cuenta del organizador y según sus instrucciones, conforme a la Ley 1581 de 2012 y el Decreto 1377 de 2013.</p>
  <h2>2. Usos de la plataforma</h2>
  <ul><li>Evaluaciones en aulas y repasos académicos.</li><li>Evaluaciones al cierre de capacitaciones presenciales o virtuales (por ejemplo, después de una sesión en Zoom, Google Meet u otras plataformas).</li><li>Formación, certificación interna y <b>pruebas de ingreso o selección de personal</b> en empresas.</li></ul>
  <h2>3. Datos que se tratan</h2>
  <ul><li><b>Organizadores:</b> correo, nombre de la institución o empresa y datos de uso de la cuenta.</li>
  <li><b>Participantes:</b> nombre (opcional en salas abiertas), correo y/o número de celular cuando el organizador los carga en una lista de invitados, equipo, respuestas, nivel de confianza declarado, pistas usadas, tiempos y resultados.</li>
  <li><b>Técnicos:</b> fecha y hora de ingreso y datos mínimos de funcionamiento. No usamos cookies publicitarias ni vendemos datos.</li></ul>
  <h2>4. Para qué se usan</h2>
  <p>Para entregar la evaluación, calificarla, generar retroalimentación, mostrar resultados al organizador y permitirle exportarlos. En pruebas de ingreso laboral, los resultados son <b>un insumo</b> para el proceso del organizador: ${app_} no toma decisiones de contratación. El organizador debe informar a los candidatos la finalidad de la prueba, obtener su autorización cuando la ley lo exija y no usar los resultados con fines discriminatorios.</p>
  <h2>5. Inteligencia artificial</h2>
  <p>Algunas funciones (pistas, retroalimentación y resúmenes) envían el texto de las preguntas y de las respuestas a un proveedor de IA (Anthropic) para generar el comentario. Los resúmenes de grupo se envían sin nombres. No se envían correos ni celulares.</p>
  <h2>6. Dónde se guardan y por cuánto tiempo</h2>
  <p>Los datos se almacenan en servidores de Supabase, que pueden estar fuera de Colombia, con medidas de seguridad razonables. Se conservan mientras el organizador mantenga la sala. El organizador puede eliminar en cualquier momento una sala con todos sus resultados; al eliminar la cuenta se borran sus evaluaciones y salas.</p>
  <h2>7. Derechos del titular</h2>
  <p>Como participante puedes conocer, actualizar, rectificar y pedir la supresión de tus datos, y revocar tu autorización. Dirígete primero al organizador que te invitó; si no lo logras, escribe a ${em} y trasladaremos tu solicitud. Atendemos consultas en máximo 10 días hábiles y reclamos en máximo 15 días hábiles. También puedes acudir a la Superintendencia de Industria y Comercio.</p>
  <h2>8. Menores de edad</h2>
  <p>Si los participantes son menores de edad, la institución organizadora debe contar con la autorización de sus padres o representantes, y solo se tratarán los datos necesarios para la actividad educativa.</p>
  <h2>9. Términos de uso</h2>
  <ul><li>La prueba gratuita dura 7 días, no requiere tarjeta e incluye herramientas limitadas. Después, las funciones se activan con un plan de pago.</li>
  <li>El organizador es responsable del contenido de sus evaluaciones, de contar con los permisos para cargar datos de terceros (listas de invitados) y de enviar las invitaciones por sus propios canales (correo o WhatsApp).</li>
  <li>Está prohibido usar la plataforma para recoger datos sensibles innecesarios, suplantar a otras personas o hacer envíos masivos no autorizados (spam).</li>
  <li>Los enlaces personales de invitación son intransferibles.</li>
  <li>Hacemos lo posible por mantener el servicio disponible, pero puede haber interrupciones. Exporta tus resultados con regularidad.</li>
  <li>Las retroalimentaciones generadas con IA son orientativas y pueden contener errores; la calificación oficial depende de las respuestas configuradas por el organizador.</li>
  <li>Podemos actualizar este aviso; la fecha de actualización aparece arriba.</li></ul>
  <div class="row noprint" style="margin-top:12px"><button class="btn sec" onclick="history.length>1?history.back():go('#/')">Volver</button></div></section>`;
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='theme'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');nav()}
  else if(a==='home')go(user&&location.hash.startsWith('#/t')?'#/t':'#/');

  else if(a==='dash')go('#/t');

  else if(a==='delq'){collect();const u=QS.splice(+t.dataset.i,1)[0];DEL.push(u.id);drawEditor()}
  else if(a==='gen')genQ();
  else if(a==='detail'){RS.sel=t.dataset.id;drawRes();$('main').scrollTo?.(0,0)}
  else if(a==='csv')exportCsv();
  else if(a==='fs')document.documentElement.requestFullscreen?.();
  else if(a==='delrooms'){const ids=t.dataset.ids.split(',').filter(Boolean);const ch=await askDelete(ids.length);if(!ch)return;
    try{if(ch==='export')await exportRooms(ids);const r=await sb.from('rooms').delete().in('id',ids);if(r.error)throw r.error;toast(ids.length>1?ids.length+' salas eliminadas':'Sala eliminada')}catch(x){toast(msg(x))}dashView()}
  else if(a==='stoproom'){if(confirm('¿Detener el reloj? La evaluación termina para todos ahora mismo; las respuestas ya enviadas quedan guardadas.')){RS.manualStop=true;const r=await sb.rpc('stop_room',{p_room:RS.room.id});if(r.error)toast(msg(r.error));else toast('Reloj detenido');await refreshRes()}}
  else if(a==='sendstart'){RS.send={ch:null,pend:true,i:0,sent:0,ids:[]};drawRes()}
  else if(a==='sendch'){const S=RS.send;S.pend=!!$('#spend')?.checked;S.ch=t.dataset.v;
    S.ids=RS.ps.filter(p=>p.invited&&(!S.pend||(!p.started_at&&!p.finished_at))&&(S.ch!=='mail'||p.email)).sort((x,y)=>(x.name||'').localeCompare(y.name||'')).map(p=>p.id);
    if(!S.ids.length){RS.send=null;toast(S.ch==='mail'?'No hay invitados pendientes con correo.':'No hay invitados pendientes.')}drawRes()}
  else if(a==='sendone'){const S=RS.send,p=RS.ps.find(x=>x.id===S.ids[S.i]);if(p){const mt=inviteMsg(p,RS.ev.title,invLink(p.token));

  else if(a==='sendskip'){RS.send.i++;drawRes()}
  else if(a==='sendx'){RS.send=null;drawRes()}
  else if(a==='drive'){const u=$('#invurl').value.trim();if(!u)return toast('Pega el enlace de la hoja.');t.disabled=true;
    try{const r=await api('sheet',{url:u},true);const b=Uint8Array.from(atob(r.b64),c=>c.charCodeAt(0));
